name: Full Ubuntu GNOME + RDP + Tailscale + AnythingLLM + Ollama

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-full:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: ubuntu-full-anythingllm-${{ github.run_id }}
      OLLAMA_MODEL: llama3.2:1b
      ANYTHINGLLM_PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - name: Set user password and sudo
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install Ubuntu Desktop (GNOME) + xrdp
        run: |
          sudo apt-get update -qq
          # Ubuntu Desktop minimal (GNOME)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ubuntu-desktop-minimal xrdp
          # Set GNOME as default for RDP session
          echo "gnome-session" | sudo tee /home/${USERNAME}/.xsession
          sudo chown ${USERNAME}:${USERNAME} /home/${USERNAME}/.xsession
          # Fix for xrdp to work with GNOME
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          sudo usermod -aG docker ${USERNAME}
          sudo systemctl start docker

      - name: Install Ollama (local LLM server)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama
          sudo systemctl enable ollama
          # Wait for Ollama to be ready
          sleep 10
          ollama pull ${OLLAMA_MODEL}
          ollama list

      - name: Create Data Volume and Deploy AnythingLLM
        run: |
          # පැරණි storage එක clean කරගන්න (අවශ්‍ය නම්)
          # sudo rm -rf /home/${USERNAME}/anythingllm
          # නව storage location එක හදන්න
          export STORAGE_LOCATION="/home/${USERNAME}/anythingllm"
          mkdir -p ${STORAGE_LOCATION}
          touch "${STORAGE_LOCATION}/.env"
          
          docker volume create anythingllm
          docker run -d \
            -p ${ANYTHINGLLM_PORT}:3001 \
            --cap-add SYS_ADMIN \
            --add-host=host.docker.internal:host-gateway \
            -v ${STORAGE_LOCATION}:/app/server/storage \
            -v ${STORAGE_LOCATION}/.env:/app/server/.env \
            -e STORAGE_DIR="/app/server/storage" \
            --name anythingllm \
            --restart=unless-stopped \
            mintplexlabs/anythingllm
          
          # Wait for AnythingLLM to be ready
          echo "Waiting for AnythingLLM to start..."
          for i in {1..30}; do
            if curl -s -f -o /dev/null --max-time 5 http://localhost:${ANYTHINGLLM_PORT}; then
              echo "AnythingLLM ready"
              break
            fi
            sleep 5
          done

      - name: Connection Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -n1 | tr -d ' ')
          echo "============================================================"
          echo "           FULL SETUP READY - ANYTHINGLLM                   "
          echo "============================================================"
          echo "RDP CONNECTION:"
          echo "  Address: ${TS_IP}:3389"
          echo "  Username: ${USERNAME}"
          echo "  Password: ${PASSWORD}"
          echo ""
          echo "ANYTHINGLLM (Local RAG + Ollama Integration):"
          echo "  URL: http://${TS_IP}:${ANYTHINGLLM_PORT}"
          echo "  You can configure Ollama within AnythingLLM at:"
          echo "     -> Settings -> LLM Preference -> Ollama"
          echo "     -> Ollama Base URL: http://host.docker.internal:11434"
          echo ""
          echo "OLLAMA API ACCESS (Optional):"
          echo "  URL: http://${TS_IP}:11434"
          echo "  Pre-loaded model: ${OLLAMA_MODEL}"
          echo ""
          echo "Tailscale Hostname: ${TAILSCALE_HOSTNAME}"
          echo "============================================================"
          echo "Connect via RDP to desktop, then you can open Firefox and"
          echo "access http://localhost:${ANYTHINGLLM_PORT} inside the remote desktop as well."
          echo ""
          echo "⏺ ANYTHINGLLM එකේ ප්‍රධාන වාසි:"
          echo "   ✅ Workspace-based document management (RAG)"
          echo "   ✅ Multiple LLM support (Ollama, OpenAI, etc.)"
          echo "   ✅ Multi-user access & permission control"
          echo "   ✅ Embedded chat widget for websites"
          echo ""
          echo "Workflow will stay alive until manually cancelled."
          echo "============================================================"

      - name: Keep Runner Alive
        run: |
          while true; do
            sleep 600
          done
